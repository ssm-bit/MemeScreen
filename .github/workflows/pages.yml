# Builds the MemeScreen web app and publishes it to GitHub Pages on every push to main.
# One-time setup on GitHub: repo Settings → Pages → Source: "GitHub Actions".
# The site then lives at https://ssm-bit.github.io/MemeScreen/  (phone: add ?m=1)
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: memescreen/package-lock.json
      - run: npm ci
        working-directory: memescreen
      - run: npm run build
        working-directory: memescreen
        env:
          MS_BASE: /MemeScreen/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: memescreen/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
